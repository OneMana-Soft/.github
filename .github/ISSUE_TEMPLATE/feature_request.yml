name: Something is missing
description: A concrete change you would like OneCamp to make.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way today
      description: The situation, not the solution. "We lose decisions made in calls" says more than "add a button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do instead now
      description: Another tool, a workaround, or nothing.
  - type: checkboxes
    id: help
    attributes:
      label: Would you build it?
      options:
        - label: I would like to open a pull request for this, with some guidance.
